apiVersion: apps/v1
kind: Deployment
metadata:
  name: comin-employee-service
  namespace: comin-dev
  labels:
    app: comin-employee-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comin-employee-service
  template:
    metadata:
      labels:
        app: comin-employee-service
    spec:
      containers:
      - name: comin-employee-service
        image: ghcr.io/kaveeshag/comin-employee-service:3a741178b15ae31586aea584369649fb6a5d763f
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        env:
        - name: GO_ENV
          value: "development"
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.2"
            memory: "256Mi"